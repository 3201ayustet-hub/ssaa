<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fffaf0">
  <meta name="description" content="旅行した県を塗って競う4人用日本全国陣取りゲーム">
  <title>日本全国陣取りゲーム</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <section id="setupView" class="screen hidden">
      <header class="setup-hero">
        <div class="eyebrow">TRAVEL TERRITORY GAME</div>
        <h1>日本全国<br><span>陣取りゲーム</span></h1>
        <p>旅行した県が、そのまま自分の陣地になる。</p>
      </header>
      <div class="setup-panel">
        <div class="section-head">
          <div>
            <span class="kicker">GAME SETUP</span>
            <h2>プレイヤー登録</h2>
          </div>
          <span class="pill">4人</span>
        </div>
        <div id="playerForm" class="player-form"></div>
        <button id="startGameBtn" class="primary-btn">このメンバーでゲームを始める</button>
        <p class="small-note">名前・居住県・色はゲーム開始後も管理画面から変更できます。</p>
      </div>
    </section>

    <section id="gameView" class="screen hidden">
      <header class="topbar">
        <div>
          <div class="eyebrow">TRAVEL TERRITORY</div>
          <h1>日本全国陣取り</h1>
        </div>
        <button id="adminBtn" class="icon-btn" aria-label="管理">⚙</button>
      </header>

      <main>
        <section class="map-stage">
          <div class="map-meta">
            <div>
              <span class="kicker">CURRENT MAP</span>
              <strong id="periodLabel">第1期</strong>
            </div>
            <button id="recordBtn" class="record-chip">＋ 旅行を記録</button>
          </div>
          <div id="mapMount" class="map-mount" aria-label="都道府県マップ"></div>
          <div id="recentEvents" class="event-strip"></div>
        </section>

        <section class="players-section">
          <div class="section-head compact">
            <div>
              <span class="kicker">PLAYERS</span>
              <h2>現在の勢力</h2>
            </div>
            <span id="targetCount" class="muted"></span>
          </div>
          <div id="playerCards" class="player-cards"></div>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="メインナビゲーション">
        <button class="nav-item active" data-tab="map">🗾<span>マップ</span></button>
        <button class="nav-item" data-tab="record">📷<span>記録</span></button>
        <button class="nav-item" data-tab="history">▤<span>履歴</span></button>
        <button class="nav-item" data-tab="menu">☰<span>メニュー</span></button>
      </nav>
    </section>
  </div>

  <div id="sheet" class="sheet-backdrop hidden">
    <div class="bottom-sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <button id="sheetClose" class="sheet-close" aria-label="閉じる">×</button>
      <div id="sheetContent"></div>
    </div>
  </div>

  <template id="playerCardTemplate">
    <button class="player-card">
      <span class="player-dot"></span>
      <span class="player-card-main">
        <span class="player-name"></span>
        <span class="player-stats"><b class="player-points"></b><span class="player-count"></span></span>
      </span>
      <span class="chevron">›</span>
    </button>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
