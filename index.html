<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>日本全国陣取りゲーム v1.2</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main id="app" class="game-shell">
    <header class="topbar">
      <div><small>日本全国陣取り</small><h1>桃鉄風 全国マップ</h1></div>
      <span id="status" class="status">LOCAL</span>
    </header>
    <section id="summary" class="summary"></section>
    <section class="panel">
      <div class="panel-head"><h2>都道府県</h2><span id="filter-label">全て</span></div>
      <div id="map" class="prefecture-grid"></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>プレイヤー</h2><button id="reset" class="ghost">リセット</button></div>
      <div id="players" class="players"></div>
    </section>
    <section class="panel">
      <h2>記録</h2>
      <form id="stay-form" class="form">
        <select id="player" required></select>
        <select id="prefecture" required></select>
        <input id="date" type="date" required>
        <button type="submit">滞在を登録</button>
      </form>
      <div id="message" class="message"></div>
    </section>
  </main>
  <script src="data.js"></script>
  <script src="game.js"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
